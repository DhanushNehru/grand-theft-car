<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grand Theft Car — coastal city drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e14; font-family: "Segoe UI", system-ui, sans-serif; color: #e8ecf3; }
  #app { position: fixed; inset: 0; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #cash { position: absolute; top: 14px; left: 16px; font-size: 26px; font-weight: 700; color: #7ee787; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #mission-box { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; max-width: min(520px, 80vw);
    background: rgba(10,14,22,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 16px; backdrop-filter: blur(4px); }
  #mission-title { font-weight: 700; color: #ffd76d; font-size: 15px; }
  #mission-text { font-size: 13px; color: #cdd6e4; }
  #mission-timer { font-size: 15px; font-weight: 700; color: #79c0ff; }
  #mission-timer.low { color: #ff7b72; }
  #speed { position: absolute; bottom: 18px; right: 20px; font-size: 30px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #speed small { font-size: 13px; font-weight: 400; color: #9aa7bd; }
  #minimap { position: absolute; top: 14px; right: 14px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(8,10,16,.8); width: 132px; height: 132px; }
  #toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 800; color: #7ee787; text-shadow: 0 2px 10px rgba(0,0,0,.85); opacity: 0; transition: opacity .25s; }
  #toast.show { opacity: 1; }
  #hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #cdd6e4; background: rgba(10,14,22,.72); border-radius: 8px; padding: 6px 14px; border: 1px solid rgba(255,255,255,.1); }
  #hint:empty { display: none; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(20,12,30,.75), rgba(5,7,11,.95)); z-index: 10; }
  #overlay.hidden { display: none; }
  #overlay-card { text-align: center; padding: 28px; max-width: 540px; }
  #overlay-card h1 { font-size: clamp(40px, 9vw, 68px); letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(180deg, #ffb35c, #ff5e8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { color: #c9b8d4; margin: 12px 0; font-size: 15px; }
  #start-btn { pointer-events: auto; cursor: pointer; margin-top: 10px; font-size: 18px; font-weight: 700; color: #241318;
    background: linear-gradient(180deg, #ffd76d, #ffb35c); border: none; border-radius: 10px; padding: 14px 42px; }
  #start-btn:hover { filter: brightness(1.08); }
  #touch { display: none; }
  #touch .tcluster { position: absolute; bottom: 84px; display: flex; gap: 10px; pointer-events: auto; }
  #touch .left { left: 14px; align-items: flex-end; }
  #touch .right { right: 14px; align-items: flex-end; }
  #touch button { width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    background: rgba(20,26,38,.6); color: #e8ecf3; font-size: 22px; font-weight: 700; touch-action: none; user-select: none; -webkit-user-select: none; }
  #touch button:active { background: rgba(255,183,92,.55); }
  #touch .drift { width: 58px; font-size: 11px; letter-spacing: 1px; color: #ffd76d; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #hint { display: none; }
  }
  @media (max-width: 700px) {
    #minimap { width: 92px; height: 92px; }
    #mission-box { top: 108px; max-width: 92vw; }
    #speed { font-size: 22px; bottom: 12px; right: 14px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="cash">$0</div>
  <div id="mission-box">
    <div id="mission-title"></div>
    <div id="mission-text"></div>
    <div id="mission-timer"></div>
  </div>
  <canvas id="minimap" width="168" height="168"></canvas>
  <div id="speed"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="touch">
    <div class="tcluster left">
      <button data-k="left" aria-label="Steer left">&#9664;</button>
      <button data-k="right" aria-label="Steer right">&#9654;</button>
      <button class="drift" data-k="brake" aria-label="Handbrake">DRIFT</button>
    </div>
    <div class="tcluster right">
      <button data-k="up" aria-label="Accelerate">&#9650;</button>
      <button data-k="down" aria-label="Brake and reverse">&#9660;</button>
    </div>
  </div>
</div>
<div id="overlay">
  <div id="overlay-card">
    <h1>GRAND THEFT CAR</h1>
    <p class="tag">Sunset on the coast. Take the wheel, run deliveries along the palm highway.</p>
    <p class="tag" style="font-size:12px;color:#8a7f94">An unofficial, original browser game. Not affiliated with any existing game franchise.</p>
    <p class="tag">W A S D to drive · Space to drift · touch controls on mobile</p>
    <button id="start-btn">Hit the coast road</button>
  </div>
</div>
<script type="module" src="js/main3d.js"></script>
</body>
</html>
